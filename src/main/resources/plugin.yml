name: Grace
version: '1.0.0'
main: com.larpilz.grace.GracePeriodPlugin
api-version: '1.21'
author: larpilz
description: Grace period v1.0.0

commands:
  grace:
    description: Manage the server grace period.
    usage: /grace <start|stop|pause|resume|status> [duration]
    aliases: [gp, graceperiod]
    permission: graceperiod.admin

permissions:
  grace.admin:
    description: Allows starting/stopping the grace period.
    default: op
